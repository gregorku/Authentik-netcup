###############################################################################
#
# Monitoring-netcup Project
#
# File:
#   configs/prometheus/wireguard-peers.yml
#
# Description:
#   Ruční mapa WireGuard AllowedIPs -> název peeru.
#
#   Tento soubor je načítán Prometheem jako recording rules.
#
#   Při přidání nebo přejmenování peeru uprav pouze tento soubor.
#
###############################################################################

groups:
  - name: wireguard_peer_names

    interval: 15s

    rules:
      #########################################################################
      # Mikrotik bratrmach
      #########################################################################

      - record: wireguard_peer_info
        expr: vector(1)
        labels:
          allowed_ips: "10.100.100.10/32"
          peer_name: "Mikrotik bratrmach"

      - record: wireguard_peer_info
        expr: vector(1)
        labels:
          allowed_ips: "10.110.100.10/32"
          peer_name: "Mikrotik bratrmach"

      - record: wireguard_peer_info
        expr: vector(1)
        labels:
          allowed_ips: "10.120.100.10/32"
          peer_name: "Mikrotik bratrmach"

      #########################################################################
      # Mikrotik doma
      #########################################################################

      - record: wireguard_peer_info
