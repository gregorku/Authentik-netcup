###############################################################################
#
# Monitoring-netcup Project
#
# File:
#   configs/alertmanager/alertmanager.yml
#
# Description:
#   Alertmanager configuration for alert routing and notifications.
#
###############################################################################

global:
  # Global configuration for all notifications
  resolve_timeout: 5m

# Route tree for alert routing
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'

# Notification receivers
receivers:
  - name: 'default-receiver'
    # Minimal receiver for testing - no external notifications yet
    # Future: add email, webhook, or other notification channels

# Inhibition rules (optional)
inhibit_rules: []
